# Fallback profile: 4-core / 8 GB floor, minimal download (<500 MB) so a
# bandwidth-limited or locked-down evaluator can still run the demo (NFR-12, A-3).
profile: fast
embedding_model: sentence-transformers/all-MiniLM-L6-v2
embedding_dim: 384
reranker_model: cross-encoder/ms-marco-MiniLM-L-6-v2
llm_enabled: false
agent_enabled: true
dense_top_k: 50
sparse_top_k: 50
structural_top_k: 25
fusion_top_n: 15
embedding_batch_size: 32
