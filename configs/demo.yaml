# Live-demo profile: the multi-version JavaScript corpus from the problem
# statement. All three signals at the locked per-QueryType weights. This is the
# profile the jury sees (PRD.md 2.2) and the only one where the structural
# signal earns its keep.
#
# RERANKER: ms-marco-MiniLM-L-6-v2 is PRIMARY here, not the fallback.
# bge-reranker-v2-m3 is XLM-RoBERTa-large (24 layers, hidden 1024). Scoring 25
# pairs of 512 tokens is ~8,375 GFLOP, which to land in the documented 620 ms
# would demand ~13.5 TOPS -- roughly 2.6x the theoretical peak of the 8-core
# AVX-512-VNNI reference box, so the real figure is seconds, not milliseconds.
# The 620 ms in TechSpecifications.md 8 is MiniLM's number recorded against
# bge's row. Latency is what the jury watches, so the demo profile buys it.
profile: demo
dense_enabled: true
sparse_enabled: true
structural_enabled: true
agent_enabled: true
reranker_enabled: true
reranker_model: cross-encoder/ms-marco-MiniLM-L-6-v2
rerank_max_chars: 4096
evolutionary_enabled: true
top_k_default: 10
