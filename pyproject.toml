[project]
name = "axiom"
version = "0.1.0"
description = "Axiom - Agentic Code Intelligence: multi-pass agentic code retrieval, CPU-only"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [
    { name = "Prabinder Singh" },
    { name = "Anish Grover" },
    { name = "Harshdeep Athawale" },
    { name = "Parth Deshmukh" },
]

dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
retrieval = [
    "bm25s>=0.2.0",
    "faiss-cpu>=1.8.0",
    "onnxruntime>=1.18",
    "transformers>=4.40",
    "tokenizers>=0.19",
]
structural = [
    "tree-sitter>=0.22",
    "tree-sitter-javascript>=0.21",
]
agent = [
    "llama-cpp-python>=0.2.80",
]
serve = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "streamlit>=1.35",
]
eval = [
    "mteb>=2.0.0",
    "datasets>=2.19",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "psutil>=5.9",
]

[project.scripts]
axiom = "axiom.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/axiom"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["axiom.core.*", "axiom.retrieval.*", "axiom.schema.*"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: requires model downloads or a full corpus",
    "integration: crosses module boundaries",
]
